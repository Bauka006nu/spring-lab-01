<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<p>
    Logged in as <b th:text="${currentUser}">user</b>
    (<span th:text="${currentRoles}">ROLE_USER</span>)
    <a th:if="${isAdmin}" th:href="@{/admin}">Administration</a>
</p>
<form th:action="@{/logout}" method="post">
    <button type="submit">Log out</button>
</form>

<h1 th:text="${title}">Catalogue</h1>
<p th:if="${message}" class="flash" th:text="${message}"></p>

<!-- hiding the form is only a courtesy; the server rule decides -->
<form th:if="${isAdmin}" method="post" th:action="@{/books}">
    <input name="title" placeholder="Title" required>
    <input name="author" placeholder="Author" required>
    <input name="year" type="number" placeholder="Year" required>
    <input name="owner" placeholder="Owner (default: you)">
    <button type="submit">Add</button>
</form>

<table>
    <tr><th>#</th><th>Title</th><th>Author</th><th>Year</th><th>Owner</th><th>Edit</th></tr>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}">1</td>
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.year}">2020</td>
        <td th:text="${owners[book.id]}">owner</td>
        <td>
            <form th:if="${isAdmin or owners[book.id] == currentUser}"
                  th:action="@{/books/{id}/edit(id=${book.id})}" method="post">
                <input name="title" th:value="${book.title}" required>
                <input name="author" th:value="${book.author}" required>
                <input name="year" type="number" th:value="${book.year}" required>
                <button type="submit">Save</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
